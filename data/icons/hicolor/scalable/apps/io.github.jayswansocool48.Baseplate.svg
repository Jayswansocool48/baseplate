<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Baseplate app icon: a building block on an isometric grid plate.
       Original artwork, MIT License (same as the app). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f252c"/>
      <stop offset="1" stop-color="#0f1215"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5fe6ab"/>
      <stop offset="1" stop-color="#22b877"/>
    </linearGradient>
    <clipPath id="top"><path d="M64 46 L112 70 L64 94 L16 70 Z"/></clipPath>
  </defs>
  <rect x="6" y="6" width="116" height="116" rx="26" fill="url(#bg)"/>
  <rect x="6.5" y="6.5" width="115" height="115" rx="25.5" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
  <!-- plate: side edges then top face -->
  <path d="M16 70 L64 94 L64 102 L16 78 Z" fill="#168a58"/>
  <path d="M112 70 L64 94 L64 102 L112 78 Z" fill="#0f6e45"/>
  <path d="M64 46 L112 70 L64 94 L16 70 Z" fill="url(#plate)"/>
  <!-- grid on the plate -->
  <g clip-path="url(#top)" stroke="#0b3d27" stroke-opacity=".35" stroke-width="1.6">
    <path d="M28 64 L76 88 M40 58 L88 82 M52 52 L100 76"/>
    <path d="M100 64 L52 88 M88 58 L40 82 M76 52 L28 76"/>
  </g>
  <!-- block sitting on the plate -->
  <g stroke="#0f1215" stroke-width="2.4" stroke-linejoin="round">
    <path d="M64 20 L90 33 L64 46 L38 33 Z" fill="#ffffff"/>
    <path d="M38 33 L64 46 L64 76 L38 63 Z" fill="#d7dee6"/>
    <path d="M90 33 L64 46 L64 76 L90 63 Z" fill="#a9b4c0"/>
  </g>
</svg>
