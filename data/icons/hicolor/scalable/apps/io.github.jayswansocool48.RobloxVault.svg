<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Roblox Vault app icon: a vault door with a building block in the dial.
       Original artwork, MIT License (same as the app). -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d5a99"/>
      <stop offset="1" stop-color="#22325c"/>
    </linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8edf5"/>
      <stop offset="1" stop-color="#b9c4d6"/>
    </linearGradient>
    <linearGradient id="dial" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#f4a62a"/>
    </linearGradient>
  </defs>
  <!-- feet + shadow -->
  <rect x="24" y="108" width="14" height="10" rx="3" fill="#18233f"/>
  <rect x="90" y="108" width="14" height="10" rx="3" fill="#18233f"/>
  <!-- body -->
  <rect x="10" y="10" width="108" height="102" rx="20" fill="url(#body)"/>
  <rect x="10" y="10" width="108" height="102" rx="20" fill="none" stroke="#18233f" stroke-opacity=".35" stroke-width="2"/>
  <!-- door -->
  <rect x="20" y="20" width="88" height="82" rx="13" fill="url(#door)"/>
  <!-- hinges -->
  <rect x="15" y="34" width="9" height="14" rx="3" fill="#8a97ad"/>
  <rect x="15" y="74" width="9" height="14" rx="3" fill="#8a97ad"/>
  <!-- dial ring + spokes -->
  <circle cx="64" cy="61" r="29" fill="#22325c"/>
  <g stroke="#22325c" stroke-width="6" stroke-linecap="round">
    <line x1="64" y1="25" x2="64" y2="32"/>
    <line x1="64" y1="90" x2="64" y2="97"/>
    <line x1="28" y1="61" x2="35" y2="61"/>
    <line x1="93" y1="61" x2="100" y2="61"/>
  </g>
  <circle cx="64" cy="61" r="23" fill="url(#dial)"/>
  <!-- block in the dial (isometric cube) -->
  <g stroke="#22325c" stroke-width="2.5" stroke-linejoin="round">
    <path d="M64 46 L78 54 L64 62 L50 54 Z" fill="#ffffff"/>
    <path d="M50 54 L64 62 L64 77 L50 69 Z" fill="#9fb3d9"/>
    <path d="M78 54 L64 62 L64 77 L78 69 Z" fill="#6f87bd"/>
  </g>
</svg>
