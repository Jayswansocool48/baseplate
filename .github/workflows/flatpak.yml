# Builds the Flatpak on every push to main and publishes it to GitHub Pages,
# where the COSMIC Store picks up updates. Needs the FLATPAK_GPG_KEY secret,
# which packaging/publish-setup.sh creates.
name: Flatpak

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flatpak-pages
  cancel-in-progress: false

env:
  APP_ID: io.github.jayswansocool48.Baseplate

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.key.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: python3 -m unittest discover -t . -s tests

      - name: Install Flatpak tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          # Ubuntu 24.04 blocks the user namespaces flatpak-builder's sandbox needs
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak --version; flatpak-builder --version

      - name: Pin Rojo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 packaging/pin-rojo.py

      - name: Load signing key
        id: key
        env:
          FLATPAK_GPG_KEY: ${{ secrets.FLATPAK_GPG_KEY }}
        run: |
          if [ -z "$FLATPAK_GPG_KEY" ]; then
            echo "::warning::No FLATPAK_GPG_KEY secret yet, so this build is not published. Run packaging/publish-setup.sh."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$FLATPAK_GPG_KEY" | gpg --batch --import
          KEYID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/ {print $5; exit}')
          echo "keyid=$KEYID" >> "$GITHUB_OUTPUT"
          echo "pubkey=$(gpg --export "$KEYID" | base64 -w0)" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: .flatpak-builder
          key: flatpak-builder-${{ hashFiles('packaging/*.yml', 'packaging/rojo.json') }}
          restore-keys: flatpak-builder-

      - name: Build
        run: |
          # On failure, put the end of the log in an annotation so it shows on
          # the run's summary page.
          report() {
            msg=$(tail -n 25 "$RUNNER_TEMP/build.log" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=$1::$msg"
            exit 1
          }
          mkdir -p site   # flatpak-builder won't create the repo's parent folder
          SIGN=()
          if [ -n "${{ steps.key.outputs.keyid }}" ]; then SIGN=(--gpg-sign="${{ steps.key.outputs.keyid }}"); fi
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse \
            --force-clean --default-branch=stable "${SIGN[@]}" \
            --repo=site/repo build "packaging/$APP_ID.yml" > "$RUNNER_TEMP/build.log" 2>&1 \
            || report "flatpak-builder failed"
          tail -n 5 "$RUNNER_TEMP/build.log"
          flatpak build-update-repo "${SIGN[@]}" --generate-static-deltas --prune \
            --title="Baseplate" --default-branch=stable site/repo > "$RUNNER_TEMP/build.log" 2>&1 \
            || report "build-update-repo failed"
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            site/repo site/Baseplate.flatpak "$APP_ID" stable > "$RUNNER_TEMP/build.log" 2>&1 \
            || report "build-bundle failed"

      - name: Write install page
        if: steps.key.outputs.publish == 'true'
        run: |
          cp "data/icons/hicolor/scalable/apps/$APP_ID.svg" site/icon.svg
          python3 packaging/make-site.py site "${{ steps.key.outputs.pubkey }}"

      - uses: actions/upload-artifact@v4
        with:
          name: Baseplate.flatpak
          path: site/Baseplate.flatpak

      - uses: actions/upload-pages-artifact@v3
        if: steps.key.outputs.publish == 'true'
        with:
          path: site

  publish:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
